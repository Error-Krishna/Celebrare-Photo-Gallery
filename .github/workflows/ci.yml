name: CI Quality Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  validate:
    name: Lint, Typecheck, Test & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: 'npm'

      - name: Install dependencies (clean install)
        run: npm ci

      - name: Code Quality (Oxlint)
        run: npm run lint

      - name: TypeScript Static Typecheck
        run: npm run typecheck

      - name: Execute Unit Test Suite
        run: npm test

      - name: Production Bundle Verification
        run: npm run build
